name: BorderoX PWA Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and service worker contract
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool manifest.webmanifest >/dev/null
          python - <<'PY'
          import json, re, pathlib, sys
          manifest=json.loads(pathlib.Path('manifest.webmanifest').read_text())
          required=['name','short_name','start_url','display','theme_color','icons']
          missing=[k for k in required if not manifest.get(k)]
          if missing:
              raise SystemExit(f'manifest missing: {missing}')
          icons=manifest['icons']
          sizes={i.get('sizes') for i in icons}
          if not {'192x192','512x512'} <= sizes:
              raise SystemExit('manifest requires 192x192 and 512x512 icons')
          if not any(i.get('sizes')=='512x512' and 'maskable' in i.get('purpose','') for i in icons):
              raise SystemExit('manifest requires a 512x512 maskable icon')

          sw=pathlib.Path('sw.js').read_text()
          app=pathlib.Path('app.js').read_text()
          m=re.search(r"CACHE_NAME='([^']+)'", sw)
          if not m:
              raise SystemExit('CACHE_NAME not found')
          cache=m.group(1)
          expected=f"./sw.js?v={cache}"
          if expected not in app:
              raise SystemExit(f'service worker registration must use exact version: {expected}')
          if "updateViaCache:'none'" not in app:
              raise SystemExit("service worker registration must use updateViaCache:'none'")
          checks=[
              "request.headers.has('authorization')",
              "request.headers.has('cookie')",
              "request.headers.has('range')",
              "request.headers.has('if-range')",
              "response.headers.has('set-cookie')",
              "response.headers.has('content-range')",
              "key==='range'",
              "key==='if-range'",
          ]
          absent=[c for c in checks if c not in sw]
          if absent:
              raise SystemExit(f'service worker safety checks missing: {absent}')
          PY
